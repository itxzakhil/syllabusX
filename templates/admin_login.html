{% extends "base.html" %}

{% block title %}Faculty Login — SyllabusX{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <span class="portal-badge faculty-badge-style">FACULTY PORTAL</span>
            <h1>Faculty / Teacher Login</h1>
            <p>Access student attendance and assessment records</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}">

            <div class="form-group">
                <label for="email">Faculty / Admin Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter official email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter faculty password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary full-width" style="background: #2563eb;">
                Login as Faculty →
            </button>

        </form>

        <div class="auth-links">
            <a href="{{ url_for('login', tab='student') }}">
                ← Switch to Student Portal Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
